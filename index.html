const K='tick-v1',now=()=>{let d=new Date;return `${d.getFullYear()}-${('0'+(d.getMonth()+1)).slice(-2)}-${('0'+d.getDate()).slice(-2)}`},date=s=>new Date(s+'T12:00:00'),plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)},uid=()=>Math.random().toString(36).slice(2),e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(K))||{tasks:[]}}catch{db={tasks:[]}};let tab='home',period='today',draft=null,selected=new Set;let captureView='captures',openCapture=null,selectionText='',captureTimer=null;if(!db||typeof db!=='object')db={tasks:[]};if(!Array.isArray(db.tasks))db.tasks=[];db.tasks.forEach(t=>{if(!Array.isArray(t.steps))t.steps=[];if(!t.repeat)t.repeat='none';if(!t.title)t.title='Untitled Task'});if(!Array.isArray(db.captures))db.captures=[];if(!Array.isArray(db.ideas))db.ideas=[];if(!Array.isArray(db.folders))db.folders=[];if(!Array.isArray(db.expandedFolders))db.expandedFolders=[];function persist(){try{localStorage.setItem(K,JSON.stringify(db))}catch(err){console.error('TICK save error',err)}}function rollover(){db.tasks.forEach(t=>{if(!t.done&&t.bucket==='today'&&t.date&&t.date<now()){t.date=now();t.carried=true}});persist()}rollover();document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();render()}});function active(b){return db.tasks.filter(t=>!t.done&&(b==='week'?(t.bucket==='week'||(t.bucket==='today'&&t.date>now())):(t.bucket===b&&(b!=='today'||!t.date||t.date<=now()))))}function title(t){return e(t.title)}function row(t){return `<div class="task-swipe" data-task-id="${t.id}"><button class="swipe-delete" onclick="removeTask('${t.id}')">Delete</button><div class="task"><button class="check" onclick="complete('${t.id}')"></button><div class="taskname" onclick="form('${t.id}')">${title(t)} ${t.carried?'<span class="pill">Carried over</span>':''}${t.steps.length?`<div class="small">${t.steps.filter(s=>s.done).length}/${t.steps.length} subtasks</div>`:''}</div><button class="dots" onclick="moveMenu('${t.id}')">⋯</button></div></div>`}function list(b){let a=active(b);return a.length?`<div class="list">${a.map(row).join('')}</div>`:'<div class="empty">No tasks here yet</div>'}function quick(b){return `<form class="quick" onsubmit="event.preventDefault();add(this.elements.title.value,'${b}');this.reset();this.elements.title.focus()"><input name="title" placeholder="${b==='backlog'?'Quick capture tasks':'Add a task'}" required><button>Add</button></form>`}function heading(label,b){return `<div class="heading"><div style="flex:1"><h2>${label}</h2><div class="muted">${b==='today'?new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):b==='backlog'?'Unscheduled tasks':''}</div></div><span class="count">${active(b).length} tasks</span><button class="round" onclick="form(null,'${b}')">+</button></div>`}function render(){document.getElementById('previewSelectionTools')?.remove();let m=document.getElementById('main');if(tab==='home'){m.innerHTML=`<div class="heading"><h2>What would you like to do?</h2></div><div class="home-choices"><button onclick="tab='today';render()"><span class="home-icon">✓</span><span><strong>Tasks</strong><small>Today, Backlog and upcoming tasks</small></span><span>›</span></button><button onclick="tab='dictations';openCapture=null;render()"><span class="home-icon">✎</span><span><strong>Dictations</strong><small>Speak freely. Organise later.</small></span><span>›</span></button><button onclick="tab='ideas';openCapture=null;render()"><span class="home-icon">✧</span><span><strong>Ideas</strong><small>Permanent library and folders</small></span><span>›</span></button></div>`}if(tab==='today'){let b=period;m.innerHTML=`<div class="task-destinations"><button class="task-backlog-link" onclick="tab='backlog';render()"><span class="destination-icon">▤</span><span class="destination-title">Backlog</span><span class="destination-count">${active('backlog').length} tasks</span><span class="destination-arrow">›</span></button></div><div class="tabs">${[['today','Today'],['week','Week'],['month','Month'],['someday','Someday']].map(([k,n])=>`<button class="${b===k?'active':''}" onclick="period='${k}';render()">${n}</button>`).join('')}</div>${heading(({today:'Today',week:'Later This Week',month:'Later This Month',someday:'Someday'})[b],b)}${list(b)}${quick(b)}${b==='today'?`<div class="up"><h3>Upcoming</h3>${[['week','Later This Week'],['month','Later This Month'],['someday','Someday']].map(([k,n])=>`<button onclick="period='${k}';render()"><span><b>${n}</b><br><small>${e(active(k).slice(0,2).map(t=>t.title).join(', ')||'No tasks')}</small></span><b>${active(k).length} ›</b></button>`).join('')}</div><div class="task-footer-links"><button class="completed-link" onclick="history()">✓ &nbsp; Completed Tasks (${db.tasks.filter(t=>t.done).length}) &nbsp; ›</button><button class="task-all-link" onclick="tab='all';render()">☷ &nbsp; All Tasks ›</button></div>`:''}`}
if(tab==='dictations'||tab==='ideas'){captureView=tab==='ideas'?'ideas':'captures';renderCapture(m)};if(tab==='backlog')m.innerHTML=`<div class="mini-actions"><button onclick="tab='today';render()">← Tasks</button></div>`+heading('Backlog','backlog')+'<p class="muted">Capture now. Schedule later.</p>'+quick('backlog')+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px"><button class="save" onclick="bulkCapture()">＋ Bulk Capture</button><button class="soft" onclick="bulk()">Select & schedule</button></div>'+list('backlog');if(tab==='all')m.innerHTML=`<div class="mini-actions"><button onclick="tab='today';render()">← Tasks</button></div><div class="heading"><h2>All Tasks</h2><button class="round" onclick="form()">+</button></div><input class="field" placeholder="Search tasks" oninput="document.querySelectorAll('.section .task').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">${[['today','Today'],['week','Later This Week'],['month','Later This Month'],['someday','Someday'],['backlog','Backlog']].map(([k,n])=>`<div class="section"><h3>${n} <span class="muted">${active(k).length}</span></h3>${list(k)}</div>`).join('')}`;if(tab==='settings')m.innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin:4px 0 20px"><img src="tick-logo-original.png" alt="TICK approved logo" style="width:94px;height:94px;border-radius:20px;object-fit:cover"><div><h2 style="margin:0">TICK</h2><div class="muted">It's done bro</div></div></div><h2>Settings</h2><div class="section"><h3>Completed Tasks</h3><button class="soft" onclick="history()">View history (${db.tasks.filter(t=>t.done).length})</button></div><div class="section"><h3>Data</h3><p class="muted">Saved locally in this browser.</p><button class="soft" onclick="backup()">Export backup</button> <button class="soft" onclick="document.getElementById('import').click()">Import backup</button><input hidden id="import" type="file" accept="application/json" onchange="restore(event)"></div><p class="muted">TICK v2.0 · It's done bro</p>`;document.getElementById('nav').innerHTML=[['home','⌂','Home'],['today','☑','Tasks'],['dictations','✎','Dictations'],['ideas','✧','Ideas'],['settings','⚙','Settings']].map(([k,i,n])=>`<button class="${(tab===k||(k==='today'&&(tab==='backlog'||tab==='all')))?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</button>`).join('')}

function add(name,b){if(!name.trim())return;db.tasks.unshift({id:uid(),title:name.trim(),note:'',bucket:b,date:b==='today'?now():null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false});persist();render()}function nextDate(s,r){if(r==='daily')return plus(s,1);if(r==='weekdays'){let x=s;do{x=plus(x,1)}while([0,6].includes(date(x).getDay()));return x}if(r==='weekly')return plus(s,7);if(r==='fortnightly')return plus(s,14);if(r.startsWith('custom:'))return plus(s,Math.max(1,+r.split(':')[1]||1));let d=date(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(r==='monthly'?1:r==='quarterly'?3:12));let max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}function complete(id){let t=db.tasks.find(x=>x.id===id);t.done=true;t.completedAt=new Date().toISOString();if(t.repeat!=='none'){let d=t.date||now();d=nextDate(d,t.repeat);while(d<=now())d=nextDate(d,t.repeat);db.tasks.unshift({...structuredClone(t),id:uid(),originId:t.id,date:d,done:false,carried:false,completedAt:null,steps:t.steps.map(s=>({...s,done:false}))})}persist();render()}
function show(html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)tickCloseModal()"><div class="sheet">${html}</div></div>`}function tickCloseModal(){document.getElementById('modal').innerHTML='';draft=null}function form(id=null,b='backlog'){draft=id?structuredClone(db.tasks.find(x=>x.id===id)):{id:uid(),title:'',note:'',bucket:b,date:b==='today'?now():null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false};drawForm(!!id)}function drawForm(edit){let t=draft;show(`<div class="sheethead"><button class="text" onclick="tickCloseModal()">Cancel</button><h3>${edit?'Edit Task':'Add Task'}</h3><button class="save" onclick="saveForm(${edit})">Save</button></div><label class="label">Task title</label><input id="title" class="field" value="${e(t.title)}" oninput="draft.title=this.value" placeholder="What needs doing?"><label class="label">Notes</label><textarea rows="2" oninput="draft.note=this.value">${e(t.note)}</textarea><label class="label">Schedule</label><select onchange="setBucket(this.value,${edit})">${[['backlog','Backlog'],['today','Today'],['tomorrow','Tomorrow'],['week','Later This Week'],['month','Later This Month'],['someday','Someday'],['custom','Custom date']].map(([v,n])=>`<option value="${v}" ${t.bucket===v?'selected':''}>${n}</option>`).join('')}</select>${t.bucket==='custom'?`<label class="label">Date</label><input class="field" type="date" value="${t.date||now()}" onchange="draft.date=this.value">`:''}<label class="label">Time (optional)</label><input class="field" type="time" value="${t.time||''}" onchange="draft.time=this.value"><label class="label">Repeat</label><select onchange="draft.repeat=this.value;drawForm(${edit})">${[['none','Does not repeat'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['quarterly','Every 3 months'],['yearly','Yearly'],['custom:3','Custom (days)']].map(([v,n])=>`<option value="${v}" ${t.repeat===v?'selected':''}>${n}</option>`).join('')}</select>${t.repeat.startsWith('custom:')?`<label class="label">Every N days</label><input class="field" type="number" min="1" value="${+t.repeat.split(':')[1]}" onchange="draft.repeat='custom:'+Math.max(1,+this.value||1)">`:''}<p class="note">One active occurrence at a time. Completing it schedules the next.</p><label class="label">Priority</label><select onchange="draft.priority=this.value">${['none','low','medium','high'].map(x=>`<option ${t.priority===x?'selected':''} value="${x}">${x}</option>`).join('')}</select><label class="label">Subtasks</label>${t.steps.map((s,i)=>`<div class="subrow"><input type="checkbox" ${s.done?'checked':''} onchange="draft.steps[${i}].done=this.checked"><input class="field" value="${e(s.title)}" oninput="draft.steps[${i}].title=this.value"><button onclick="draft.steps.splice(${i},1);drawForm(${edit})">✕</button></div>`).join('')}<div class="quick"><input id="newstep" placeholder="Add subtask" onkeydown="if(event.key==='Enter'){event.preventDefault();step(${edit})}"><button onclick="step(${edit})">Add</button></div><p class="note">Complete the parent task manually, even when all subtasks are done.</p>${edit?`<button class="danger" onclick="removeTask('${t.id}')">Delete Task</button>`:''}<div class="bottom"><button class="save" style="width:100%" onclick="saveForm(${edit})">${edit?'Save Changes':'Add Task'}</button></div>`)}function step(edit){let x=document.getElementById('newstep').value.trim();if(x){draft.steps.push({id:uid(),title:x,done:false});drawForm(edit);const field=document.getElementById('newstep');if(field){field.focus();field.scrollIntoView({block:'nearest'})}}}function setBucket(b,edit){draft.bucket=b;draft.date=b==='today'?now():b==='tomorrow'?plus(now(),1):b==='custom'?now():null;if(b==='tomorrow')draft.bucket='today';drawForm(edit)}function saveForm(edit){if(!draft.title.trim()){document.getElementById('title').focus();return}draft.title=draft.title.trim();draft.steps=draft.steps.filter(s=>s.title.trim());if(draft.bucket==='custom')draft.bucket='today';if(draft.repeat!=='none'&&draft.bucket==='backlog'){alert('Schedule recurring tasks before enabling repeat.');return}if(draft.repeat!=='none'&&!draft.date)draft.date=now();if(edit){let i=db.tasks.findIndex(x=>x.id===draft.id);db.tasks[i]=draft}else db.tasks.unshift(draft);persist();tickCloseModal();render()}
function moveMenu(id){let t=db.tasks.find(x=>x.id===id);let where=t.bucket==='backlog'?'Backlog':t.bucket==='someday'?'Someday':t.bucket==='month'?'This Month':t.bucket==='week'?'This Week':t.date===plus(now(),1)?'Tomorrow':'Today';show(`<div class="sheethead"><button class="text" onclick="tickCloseModal()">Close</button><h3>Task Options</h3><button class="small-delete" onclick="removeTask('${id}')">Delete</button></div><div style="margin-bottom:18px"><strong>${title(t)}</strong><div class="small" style="margin-top:5px">Currently scheduled for ${where}</div></div><button class="option-edit" onclick="tickCloseModal();form('${id}')"><span class="editicon">✎</span><span style="flex:1"><strong>Edit Task</strong><small>Change details, notes, subtasks or repeat settings</small></span><span>›</span></button><div class="section-label">▦ &nbsp; Reschedule</div><div class="schedule-grid">${[['today','☀','Today'],['tomorrow','◷','Tomorrow'],['week','▦','This Week'],['month','▤','This Month'],['someday','◌','Someday'],['backlog','▥','Backlog']].map(([k,i,n])=>`<button onclick="move('${id}','${k}')"><span style="color:#008e59;margin-right:6px">${i}</span>${n}</button>`).join('')}</div><button class="soft wide" style="margin-top:10px;text-align:left" onclick="customMove('${id}')">▦ &nbsp; Choose a specific date ›</button>`)}function customMove(id){show(`<div class="sheethead"><button class="text" onclick="moveMenu('${id}')">Back</button><h3>Choose Date</h3><span></span></div><label class="label" for="specificDate">New date</label><input id="specificDate" class="field" type="date" value="${now()}"><button class="save wide" style="margin-top:16px" onclick="moveToDate('${id}')">Save Date</button>`)}function moveToDate(id){let v=document.getElementById('specificDate').value;if(!v)return;let t=db.tasks.find(x=>x.id===id);if(!t)return;t.bucket='today';t.date=v;t.carried=false;persist();tickCloseModal();render()}
function move(id,b){let t=db.tasks.find(x=>x.id===id);t.bucket=b==='tomorrow'?'today':b;t.date=b==='today'?now():b==='tomorrow'?plus(now(),1):null;t.carried=false;persist();tickCloseModal();render()}function removeTask(id){if(!confirm('Delete this task?'))return;db.tasks=db.tasks.filter(t=>t.id!==id);persist();tickCloseModal();render()}

function capturesHtml(){if(openCapture){let c=db.captures.find(x=>x.id===openCapture);if(!c){openCapture=null;return capturesHtml()}return `<div class="mini-actions"><button onclick="saveBrain();openCapture=null;render()">← All Dictations</button><button onclick="saveBrain();alert('Capture saved')">Save</button></div><input class="field" id="brainTitle" aria-label="Capture title" value="${e(c.title)}" oninput="cTitle(this.value)" placeholder="Capture title"><p class="hint">Dictate using your iPhone keyboard microphone. Select a passage below, then tap Make Task or Save Idea. No copying required.</p><textarea id="brainText" class="field capture-editor" placeholder="Speak or type your thoughts here…">${e(c.text)}</textarea><div class="capture-actions"><button id="makeTask" onclick="convertSelection('task')" disabled>✓ Make Task</button><button id="makeIdea" onclick="convertSelection('idea')" disabled>✧ Save Idea</button></div><div id="captureMessage" class="capture-message">Highlight text to enable the actions.</div><p class="hint">Extracted text is removed from this working dictation. Undo restores it. Drafts save automatically.</p><div class="mini-actions"><button onclick="if(confirm('Delete this capture?')){db.captures=db.captures.filter(x=>x.id!=='${c.id}');persist();openCapture=null;render()}">Delete Dictation</button></div>`}
return `<p class="muted">Speak freely now. Organise later.</p><button class="save wide" onclick="newBrain()">＋ New Dictation</button>${db.captures.length?db.captures.map(c=>`<div class="capture-card" data-dictation="${c.id}"><button class="folder-head" style="background:white" onclick="openBrain('${c.id}')"><span>✎</span><span style="flex:1">${e(c.title||'Untitled Dictation')}</span><span>›</span></button><p>${e(c.text.slice(0,240))}${c.text.length>240?'…':''}</p><small class="muted">${new Date(c.createdAt).toLocaleDateString('en-AU')} · ${c.text.trim()?c.text.trim().split(/\s+/).length:0} words</small></div>`).join(''):'<div class="empty">No dictations yet. Start with a brain dump.</div>'}`}
function newBrain(){let c={id:uid(),title:'Untitled Dictation',text:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};db.captures.unshift(c);persist();openCapture=c.id;captureView='captures';selectionText='';render();document.getElementById('brainText')?.focus()}

function rememberSelection(){let a=document.getElementById('brainText');if(!a)return;let st=a.selectionStart,en=a.selectionEnd;selectionText=en>st?a.value.slice(st,en):'';if(en>st)savedBrainRange={captureId:openCapture,start:st,end:en};document.getElementById('makeTask').disabled=!selectionText.trim();document.getElementById('makeIdea').disabled=!selectionText.trim();let msg=document.getElementById('captureMessage');if(msg)msg.textContent=selectionText.trim()?`${selectionText.trim().length} characters selected`:'Highlight text to enable the actions.'}
let lastExtract=null;
function extractFromBrain(kind){const a=document.getElementById('brainText'),c=db.captures.find(x=>x.id===openCapture);if(!a||!c)return;
 const start=a.selectionStart,end=a.selectionEnd,raw=a.value;
 let st=start,en=end;if(en<=st&&savedBrainRange&&savedBrainRange.captureId===openCapture){st=savedBrainRange.start;en=savedBrainRange.end}
 if(en<=st||!raw.slice(st,en).trim()){alert('Highlight the text you want to extract first.');return}
 const chosen=raw.slice(st,en),v=chosen.trim(),id=uid();

function folderColor(id){let f=rootFolder(id);return f?.color||'#83ac94'}
function folderGlyph(){return `<svg class="tick-folder-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 6.5a2 2 0 0 1 2-2h5.3l2.1 2.3h7.6a2 2 0 0 1 2 2v9.8a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="currentColor" fill-opacity=".20" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M2.7 9.5h18.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`}
function ideaRows(folderId,depth=0){return db.ideas.filter(x=>x.folderId===folderId).map(i=>`<button class="tree-row tree-idea" style="--depth:${Math.min(depth,12)}" onclick="editIdea('${i.id}')"><span class="tree-doc">▤</span><span class="tree-title">${e(i.title||i.text.slice(0,70)||'Untitled Idea')}</span></button>`).join('')}
function folderTree(parentId,depth=0){if(depth>20)return '';return folderChildren(parentId).map(f=>{let expanded=db.expandedFolders.includes(f.id),n=db.ideas.filter(x=>x.folderId===f.id).length,col=folderColor(f.id);return `<div class="tree-group"><div class="tree-row tree-folder" style="--depth:${Math.min(depth,12)};--folder-color:${col}"><button class="tree-expand" onclick="toggleFolder('${f.id}')" aria-label="${expanded?'Collapse':'Expand'} ${e(f.name)}"><span class="tree-arrow">${expanded?'⌄':'›'}</span><span class="tree-icon">${folderGlyph()}</span><span class="tree-title">${e(f.name)}</span></button><button class="tree-menu" onclick="folderMenu('${f.id}')" aria-label="Options for ${e(f.name)}">⋯</button></div>${expanded?`<div>${folderTree(f.id,depth+1)}${ideaRows(f.id,depth+1)}</div>`:''}</div>`}).join('')}
function folderMenu(id){let f=db.folders.find(x=>x.id===id);if(!f)return;let root=!f.parentId;show(`<div class="sheethead"><h3>${e(f.name)}</h3><button class="text" onclick="tickCloseModal()">Close</button></div><div class="stack"><button onclick="tickCloseModal();newFolder('${id}')">＋ Add subfolder</button><button onclick="tickCloseModal();renameFolder('${id}')">Rename folder</button><button onclick="tickCloseModal();moveFolder('${id}')">Move folder</button>${root?`<button onclick="chooseFolderColor('${id}')">Change colour</button>`:''}<button class="danger" onclick="tickCloseModal();deleteFolder('${id}')">Delete folder</button></div>`)}
function chooseFolderColor(id){let f=db.folders.find(x=>x.id===id);if(!f||f.parentId)return;show(`<div class="sheethead"><h3>Folder colour</h3><button class="text" onclick="tickCloseModal()">Close</button></div><p class="hint">All subfolders automatically inherit this colour.</p><div class="colour-palette">${folderPalette.map(([name,hex])=>`<button style="--swatch:${hex}" onclick="setFolderColor('${id}','${hex}')"><span class="colour-dot" style="background:${hex}">${(f.color||'#83ac94')===hex?'✓':''}</span><small>${name}</small></button>`).join('')}</div>`)}
function setFolderColor(id,color){let f=db.folders.find(x=>x.id===id);if(!f||f.parentId||!folderPalette.some(x=>x[1]===color))return;f.color=color;persist();tickCloseModal();render()}
function moveFolder(id){let f=db.folders.find(x=>x.id===id);if(!f)return;let descendants=new Set([id]),changed=true;while(changed){changed=false;db.folders.forEach(x=>{if(descendants.has(x.parentId)&&!descendants.has(x.id)){descendants.add(x.id);changed=true}})}let options=db.folders.filter(x=>!descendants.has(x.id));show(`<div class="sheethead"><h3>Move ${e(f.name)}</h3><button class="text" onclick="tickCloseModal()">Cancel</button></div><label class="label">Destination</label><select id="folderMoveDestination"><option value="">Top level</option>${options.map(x=>`<option value="${x.id}" ${f.parentId===x.id?'selected':''}>${e(folderPath(x.id))}</option>`).join('')}</select><button class="save wide" style="margin-top:15px" onclick="saveFolderMove('${id}')">Move folder</button>`)}
function saveFolderMove(id){let f=db.folders.find(x=>x.id===id);if(!f)return;let target=document.getElementById('folderMoveDestination').value||null;if(target===id)return;f.parentId=target;if(target&&!db.expandedFolders.includes(target))db.expandedFolders.push(target);persist();tickCloseModal();render()}
function ideaSearchResults(){const q=ideaSearch.trim().toLowerCase();if(!q)return ideasLibraryHtml();let results=db.ideas.filter(i=>(i.title+' '+i.text+' '+folderPath(i.folderId)).toLowerCase().includes(q));return `<div class="mini-actions"><button onclick="ideaSearch='';render()">Clear search</button></div>${results.map(i=>`<div class="idea-card" onclick="editIdea('${i.id}')"><strong>${e(i.title)}</strong><p>${e(i.text.slice(0,180))}</p></div>`).join('')||'<p class="muted">No matching ideas.</p>'}`}
function ideasHtml(){return `<p class="muted">Your permanent library. Tap a folder to expand it; tap again to collapse.</p><input id="ideaSearchInput" class="field" placeholder="Search all ideas" value="${e(ideaSearch)}" oninput="updateIdeaSearch(this.value)"><div id="ideaResults">${ideaSearchResults()}</div>`}
function ideasLibraryHtml(){let open=db.expandedFolders.includes('unfiled');return `<div class="mini-actions"><button onclick="newFolder(null)">＋ New Folder</button><button onclick="newIdea()">＋ New Idea</button></div><div class="ideas-tree"><div class="tree-group"><div class="tree-row tree-folder" style="--depth:0;--folder-color:#83ac94"><button class="tree-expand" onclick="toggleFolder('unfiled')"><span class="tree-arrow">${open?'⌄':'›'}</span><span class="tree-icon">${folderGlyph()}</span><span class="tree-title">Unfiled</span></button><span class="tree-count">${db.ideas.filter(x=>!x.folderId).length}</span></div>${open?ideaRows(null,1)||'<p class="muted" style="padding-left:28px">No unfiled ideas</p>':''}</div>${folderTree(null)}</div>${!db.folders.length?'<p class="hint">Create a folder such as Writing, Dance or Music, then add subfolders as needed.</p>':''}`}
let ideaSearch='';function toggleFolder(id){db.expandedFolders=db.expandedFolders.includes(id)?db.expandedFolders.filter(x=>x!==id):[...db.expandedFolders,id];persist();render()}
function newFolder(parentId){let name=prompt('Folder name');if(!name?.trim())return;let id=uid();db.folders.push({id,name:name.trim(),parentId});if(parentId&&!db.expandedFolders.includes(parentId))db.expandedFolders.push(parentId);db.expandedFolders.push(id);persist();render()}
function renameFolder(id){let f=db.folders.find(x=>x.id===id);if(!f)return;let name=prompt('Rename folder',f.name);if(name?.trim()){f.name=name.trim();persist();render()}}
function deleteFolder(id){let f=db.folders.find(x=>x.id===id);if(!f||!confirm('Delete this folder and its subfolders? Ideas inside will move to Unfiled.'))return;let ids=new Set([id]);let changed=true;while(changed){changed=false;db.folders.forEach(x=>{if(ids.has(x.parentId)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}db.ideas.forEach(i=>{if(ids.has(i.folderId))i.folderId=null});db.folders=db.folders.filter(x=>!ids.has(x.id));db.expandedFolders=db.expandedFolders.filter(x=>!ids.has(x));persist();render()}
function folderOptions(selected){return `<option value="" ${!selected?'selected':''}>Unfiled</option>`+db.folders.map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>${e(folderPath(f.id))}</option>`).join('')}
function folderPath(id){let parts=[],seen=new Set;while(id&&!seen.has(id)){seen.add(id);let f=db.folders.find(x=>x.id===id);if(!f)break;parts.unshift(f.name);id=f.parentId}return parts.join(' / ')}
function newIdea(){let i={id:uid(),title:'',text:'',folderId:null,createdAt:new Date().toISOString()};db.ideas.unshift(i);persist();editIdea(i.id)}
function editIdea(id){let i=db.ideas.find(x=>x.id===id);if(!i)return;show(`<div class="sheethead"><button class="text" onclick="tickCloseModal()">Close</button><h3>Edit Idea</h3><button class="save" onclick="saveIdea('${id}')">Save</button></div><label class="label">Title</label><input id="ideaTitle" class="field" value="${e(i.title)}" placeholder="Idea title"><label class="label">Idea</label><textarea id="ideaBody" class="field" rows="9">${e(i.text)}</textarea><label class="label">Folder</label><select id="ideaFolder">${folderOptions(i.folderId)}</select><div class="mini-actions"><button onclick="saveIdea('${id}')">Save Changes</button><button onclick="deleteIdea('${id}')">Delete Idea</button></div>`)}
function saveIdea(id){let i=db.ideas.find(x=>x.id===id);if(!i)return;i.title=document.getElementById('ideaTitle').value.trim()||'Untitled Idea';i.text=document.getElementById('ideaBody').value;i.folderId=document.getElementById('ideaFolder').value||null;persist();tickCloseModal();render()}
function deleteIdea(id){if(!confirm('Delete this idea?'))return;db.ideas=db.ideas.filter(x=>x.id!==id);persist();tickCloseModal();render()}

document.getElementById('modal').addEventListener('click',function(ev){if(ev.target.closest('[data-cancel-bulk]')){ev.preventDefault();ev.stopPropagation();tickCloseModal();}});// Reliable delegated modal dismissal on iOS Chrome; do not depend on window.close().
document.getElementById('modal').addEventListener('click',function(ev){
 const btn=ev.target.closest('button');
 if(!btn || !this.contains(btn))return;
 if(btn.matches('[data-cancel-bulk]') || (btn.classList.contains('text') && /^(close|cancel)$/i.test(btn.textContent.trim()))){
   ev.preventDefault();ev.stopPropagation();tickCloseModal();
 }
},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape' && document.querySelector('#modal .overlay'))tickCloseModal()});
let captureItems=[];function bulkCapture(){show(`<div class="sheethead"><button class="text" type="button" data-cancel-bulk="true">Cancel</button><h3>Bulk Capture</h3><span></span></div><p class="hint">Use your iPhone keyboard microphone to dictate several tasks. Say <strong>“Next task”</strong> between them, or type each task on a new line.</p><textarea class="field bulkarea" id="captureText" placeholder="Pay the rent. Next task. Top up the printer. Next task. Book the dentist."></textarea><button class="save wide" style="margin-top:14px" onclick="capturePreview()">Review Tasks</button><p class="hint">Your dictated text stays on this device. Review everything before adding it to Backlog.</p>`)}function capturePreview(){let raw=document.getElementById('captureText').value;captureItems=raw.split(/\bnext[\s,.:;!?-]*task\b|\r?\n/gi).map(x=>x.replace(/^[\s.,;:!?-]+|[\s.,;:!?-]+$/g,'').trim()).filter(Boolean);if(!captureItems.length){alert('Enter at least one task. Say “Next task” to separate tasks.');return}drawCapturePreview()}function drawCapturePreview(){show(`<div class="sheethead"><button class="text" onclick="bulkCapture()">Back</button><h3>Review Tasks</h3><span></span></div><p class="hint">${captureItems.length} task${captureItems.length===1?'':'s'} detected. Edit or remove any item before saving.</p><div id="captureRows" class="bulkpreview"></div><button class="soft wide" onclick="captureItems.push('');drawCapturePreview()">＋ Add another task</button><button class="save wide" style="margin-top:12px" onclick="saveCapture()">Add Tasks to Backlog</button>`);let el=document.getElementById('captureRows');captureItems.forEach((x,i)=>{let r=document.createElement('div');r.className='bulkpreview-row';let input=document.createElement('input');input.className='field';input.value=x;input.setAttribute('aria-label','Task '+(i+1));input.addEventListener('input',()=>captureItems[i]=input.value);let b=document.createElement('button');b.textContent='✕';b.setAttribute('aria-label','Remove task '+(i+1));b.onclick=()=>{captureItems.splice(i,1);drawCapturePreview()};r.append(input,b);el.append(r)})}function saveCapture(){let names=captureItems.map(x=>x.trim()).filter(Boolean);if(!names.length){alert('Add at least one task.');return}for(let name of names)db.tasks.unshift({id:uid(),title:name,note:'',bucket:'backlog',date:null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false});persist();captureItems=[];tickCloseModal();tab='backlog';render()}
function bulk(){selected.clear();bulkDraw()}function bulkDraw(){show(`<div class="sheethead"><button class="text" onclick="tickCloseModal()">Cancel</button><h3>Schedule Backlog</h3><button class="text" onclick="selected=new Set(${JSON.stringify(active('backlog').map(t=>t.id))});bulkDraw()">Select all</button></div><p class="muted">${selected.size} selected</p>${active('backlog').map(t=>`<label class="task"><input type="checkbox" ${selected.has(t.id)?'checked':''} onchange="this.checked?selected.add('${t.id}'):selected.delete('${t.id}');bulkDraw()">${title(t)}</label>`).join('')}<label class="label">Move selected to</label>${[['today','Today'],['tomorrow','Tomorrow'],['week','Later This Week'],['month','Later This Month'],['someday','Someday']].map(([k,n])=>`<button class="chip" onclick="bulkMove('${k}')">${n}</button>`).join('')}`)}function bulkMove(b){selected.forEach(id=>{let t=db.tasks.find(x=>x.id===id);if(t){t.bucket=b==='tomorrow'?'today':b;t.date=b==='today'?now():b==='tomorrow'?plus(now(),1):null}});persist();tickCloseModal();render()}function history(){let a=db.tasks.filter(t=>t.done);show(`<div class="sheethead"><button class="text" onclick="tickCloseModal()">Close</button><h3>Completed Tasks</h3><span></span></div>${a.length?a.map(t=>`<div class="task"><button class="check checked" onclick="undo('${t.id}')">✓</button><div class="taskname">${title(t)}</div><small>${t.completedAt?new Date(t.completedAt).toLocaleDateString('en-AU'):''}</small></div>`).join(''):'<div class="empty">No completed tasks yet</div>'}`)}function undo(id){let t=db.tasks.find(x=>x.id===id);t.done=false;t.completedAt=null;if(t.repeat!=='none')db.tasks=db.tasks.filter(x=>x.originId!==id||x.done);persist();tickCloseModal();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='TICK-backup.json';a.click()}function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.tasks))throw Error();if(confirm('Replace current tasks with this backup?')){db=v;persist();rollover();render()}}catch{alert('Invalid backup')}};r.readAsText(f)}
let previewSelectedText='',previewSelectedCapture='';
function clearPreviewTools(){document.getElementById('previewSelectionTools')?.remove()}
function trackPreviewSelection(){
 const sel=window.getSelection();if(!sel||sel.isCollapsed)return;
 const node=sel.anchorNode?.parentElement?.closest('.capture-card');
 const end=sel.focusNode?.parentElement?.closest('.capture-card');
 if(!node||node!==end||!node.contains(sel.anchorNode)||!node.contains(sel.focusNode))return;
 const txt=sel.toString().trim();if(!txt)return;
 previewSelectedText=txt;previewSelectedCapture=node.getAttribute('data-dictation');
 let tools=document.getElementById('previewSelectionTools');if(!tools){tools=document.createElement('div');tools.id='previewSelectionTools';tools.className='selection-tools';tools.innerHTML='<button type="button" onclick="extractPreview(\'task\')">✓ Make Task</button><button type="button" onclick="extractPreview(\'idea\')">✧ Save Idea</button>';document.body.appendChild(tools)}
}
function extractPreview(kind){const txt=previewSelectedText.trim(),c=db.captures.find(x=>x.id===previewSelectedCapture);if(!txt||!c)return;const start=c.text.indexOf(txt);if(start<0){alert('Open the dictation to extract this passage.');return}
 const id=uid();if(kind==='task')db.tasks.unshift({id,title:txt,note:'',bucket:'backlog',date:null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false});else db.ideas.unshift({id,title:txt.split(/\n/)[0].slice(0,90),text:txt,folderId:null,createdAt:new Date().toISOString()});
 lastExtract={kind,id,captureId:c.id,original:c.text,start};let before=c.text.slice(0,start),after=c.text.slice(start+txt.length);if(/\s$/.test(before)&&/^\s/.test(after))after=after.replace(/^\s/,'');c.text=before+after;persist();clearPreviewTools();window.getSelection()?.removeAllRanges();previewSelectedText='';render();const m=document.getElementById('main');if(m){let b=document.createElement('div');b.className='capture-message';b.innerHTML=(kind==='task'?'Task created':'Idea saved')+' and text removed. <button onclick="undoExtract();render()">Undo</button>';m.prepend(b)}}
document.addEventListener('selectionchange',()=>{setTimeout(trackPreviewSelection,80)});
document.addEventListener('touchend',()=>setTimeout(trackPreviewSelection,250),{passive:true});
try{render()}catch(err){console.error('TICK startup error',err);document.getElementById('main').innerHTML='<div style="padding:20px;max-width:100%;overflow-wrap:anywhere"><h2>Unable to display TICK</h2><p>Your saved data has not been deleted. Please share this error so the issue can be fixed.</p><pre id="tickError" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f2;padding:12px;border-radius:12px"></pre><button id="tickRetry" style="padding:12px;background:#008c60;color:white;border:0;border-radius:10px">Retry</button> <button id="tickExport" style="padding:12px;border:1px solid #bbb;border-radius:10px">Export saved data</button></div>';document.getElementById('tickError').textContent=String(err.stack||err);document.getElementById('tickRetry').onclick=()=>location.reload();document.getElementById('tickExport').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.getItem(K)||'{}'],{type:'application/json'}));a.download='TICK-recovery-backup.json';a.click()};}
