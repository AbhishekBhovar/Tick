<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>TICK — It's done bro</title><meta name="theme-color" content="#d7f0e2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TICK"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f4;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#12202b}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:580px;margin:auto;background:white;min-height:100dvh;padding-bottom:90px}.hero{height:202px;background:linear-gradient(#d7f0e2,#f5f6dc);position:relative;padding:calc(env(safe-area-inset-top) + 27px) 18px 0}.hero:after{content:'';position:absolute;bottom:0;left:0;right:0;height:84px;background:url(skyline.png) center bottom/cover no-repeat}.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.logo{background:#008e59;color:white;border-radius:13px;font-size:36px;font-weight:bold;width:52px;height:52px;display:grid;place-items:center}.logo img{width:100%;height:100%;object-fit:cover;border-radius:13px}.brand strong{font-size:29px;line-height:1}.brand em{display:block;font-size:14px;margin-top:4px}.main{background:white;border-radius:23px 23px 0 0;position:relative;z-index:2;margin-top:-20px;padding:16px}.tabs{display:flex;gap:5px}.tabs button{flex:1;border:0;border-radius:13px;background:#f2f3f5;padding:12px 2px;font-size:13px}.tabs .active,.green{background:#008e59!important;color:white!important}.heading{display:flex;align-items:center;gap:8px;margin:22px 0 12px}.heading h2{font-size:26px;margin:0;flex:1}.muted{color:#77828b;font-size:12px}.count{color:#008e59;font-weight:700}.round{background:#008e59;border:0;border-radius:50%;color:white;font-size:25px;width:41px;height:41px}.list{border:1px solid #e9eded;border-radius:15px;overflow:hidden}.task{display:flex;align-items:center;gap:10px;min-height:49px;padding:10px 12px;border-bottom:1px solid #eff0f0}.task:last-child{border:0}.check{width:23px;height:23px;border:2px solid #99a4ae;border-radius:7px;background:white;flex-shrink:0}.checked{background:#008e59;color:white;border-color:#008e59}.taskname{flex:1;min-width:0;overflow-wrap:anywhere}.dots{background:none;border:0;font-size:22px;color:#74808c}.pill{font-size:10px;color:#62718b;background:#e9edf5;border-radius:12px;padding:4px}.quick{display:flex;gap:7px;margin:13px 0}.quick input,.field,select,textarea{width:100%;border:1px solid #e0e7e4;border-radius:12px;padding:12px;background:white;min-width:0}.quick button,.soft{border:0;background:#e5f3ec;color:#08764d;border-radius:11px;padding:11px 15px}.up{margin-top:25px}.up button{width:100%;display:flex;justify-content:space-between;text-align:left;border:0;border-radius:12px;background:#eef5ff;padding:15px;margin:7px 0}.up button:nth-child(3){background:#f3efff}.up button:nth-child(4){background:#fdf5eb}.empty{border:1px dashed #d7e2dd;border-radius:14px;padding:25px;text-align:center;color:#7d878a}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:580px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #e8e8e8;padding:9px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#7b858d;font-size:11px}.nav .on{color:#008e59;font-weight:bold}.nav b{display:block;font-size:23px;margin-bottom:3px}.overlay{position:fixed;inset:0;background:#14251d88;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:580px;max-height:94dvh;overflow:auto;padding-bottom:calc(25px + env(safe-area-inset-bottom))}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheethead h3{margin:0}.text{border:0;background:none;color:#008e59}.save{border:0;background:#008e59;color:white;border-radius:10px;padding:11px 16px}.label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600}.note{color:#7b858b;font-size:12px}.subrow{display:flex;align-items:center;gap:6px;margin:7px 0}.subrow input{flex:1;min-width:0}.subrow button{border:0;border-radius:8px;padding:10px}.section{margin:23px 0}.section h3{margin:0 0 10px}.chip{border:1px solid #dce7e0;background:white;padding:10px;border-radius:11px;margin:4px}.bottom{margin-top:20px}.danger{border:0;background:#ffeded;color:#b52d2d;border-radius:10px;padding:12px}.stack{display:grid;gap:8px}.stack button{border:0;background:#f1f5f3;border-radius:11px;padding:13px;text-align:left}.small{font-size:12px;color:#75828b}</style></head><body><div class="app"><header class="hero"><div class="brand"><div class="logo"><img src="icon-180.png" alt="TICK official logo"></div><div><strong>TICK</strong><em>It's done bro</em></div></div></header><main id="main" class="main"></main><nav class="nav" id="nav"></nav></div><div id="modal"></div><script>
const K='tick-v1',now=()=>{let d=new Date;return `${d.getFullYear()}-${('0'+(d.getMonth()+1)).slice(-2)}-${('0'+d.getDate()).slice(-2)}`},date=s=>new Date(s+'T12:00:00'),plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)},uid=()=>Math.random().toString(36).slice(2),e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(K))||{tasks:[]}}catch{db={tasks:[]}};let tab='today',period='today',draft=null,selected=new Set;function persist(){localStorage.setItem(K,JSON.stringify(db))}function rollover(){db.tasks.forEach(t=>{if(!t.done&&t.bucket==='today'&&t.date&&t.date<now()){t.date=now();t.carried=true}});persist()}rollover();document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();render()}});function active(b){return db.tasks.filter(t=>!t.done&&(b==='week'?(t.bucket==='week'||(t.bucket==='today'&&t.date>now())):(t.bucket===b&&(b!=='today'||!t.date||t.date<=now()))))}function title(t){return e(t.title)}function row(t){return `<div class="task"><button class="check" onclick="complete('${t.id}')"></button><div class="taskname" onclick="form('${t.id}')">${title(t)} ${t.carried?'<span class="pill">Carried over</span>':''}${t.steps.length?`<div class="small">${t.steps.filter(s=>s.done).length}/${t.steps.length} subtasks</div>`:''}</div><button class="dots" onclick="moveMenu('${t.id}')">⋯</button></div>`}function list(b){let a=active(b);return a.length?`<div class="list">${a.map(row).join('')}</div>`:'<div class="empty">No tasks here yet</div>'}function quick(b){return `<form class="quick" onsubmit="event.preventDefault();add(this.elements.title.value,'${b}');this.reset();this.elements.title.focus()"><input name="title" placeholder="${b==='backlog'?'Quick capture tasks':'Add a task'}" required><button>Add</button></form>`}function heading(label,b){return `<div class="heading"><div style="flex:1"><h2>${label}</h2><div class="muted">${b==='today'?new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):b==='backlog'?'Unscheduled tasks':''}</div></div><span class="count">${active(b).length} tasks</span><button class="round" onclick="form(null,'${b}')">+</button></div>`}function render(){let m=document.getElementById('main');if(tab==='today'){let b=period;m.innerHTML=`<div class="tabs">${[['today','Today'],['week','Week'],['month','Month'],['someday','Someday']].map(([k,n])=>`<button class="${b===k?'active':''}" onclick="period='${k}';render()">${n}</button>`).join('')}</div>${heading(({today:'Today',week:'This Week',month:'This Month',someday:'Someday'})[b],b)}${list(b)}${quick(b)}${b==='today'?`<div class="up"><h3>Upcoming</h3>${[['week','This Week'],['month','This Month'],['someday','Someday']].map(([k,n])=>`<button onclick="period='${k}';render()"><span><b>${n}</b><br><small>${e(active(k).slice(0,2).map(t=>t.title).join(', ')||'No tasks')}</small></span><b>${active(k).length} ›</b></button>`).join('')}</div>`:''}`}
if(tab==='backlog')m.innerHTML=heading('Backlog','backlog')+'<p class="muted">Capture now. Schedule later.</p>'+quick('backlog')+'<button class="soft" onclick="bulk()">Select & schedule</button>'+list('backlog');if(tab==='all')m.innerHTML=`<div class="heading"><h2>All Tasks</h2><button class="round" onclick="form()">+</button></div><input class="field" placeholder="Search tasks" oninput="document.querySelectorAll('.section .task').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">${[['today','Today'],['week','This Week'],['month','This Month'],['someday','Someday'],['backlog','Backlog']].map(([k,n])=>`<div class="section"><h3>${n} <span class="muted">${active(k).length}</span></h3>${list(k)}</div>`).join('')}`;if(tab==='settings')m.innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin:4px 0 20px"><img src="tick-logo-original.png" alt="TICK approved logo" style="width:94px;height:94px;border-radius:20px;object-fit:cover"><div><h2 style="margin:0">TICK</h2><div class="muted">It's done bro</div></div></div><h2>Settings</h2><div class="section"><h3>Completed Tasks</h3><button class="soft" onclick="history()">View history (${db.tasks.filter(t=>t.done).length})</button></div><div class="section"><h3>Data</h3><p class="muted">Saved locally in this browser.</p><button class="soft" onclick="backup()">Export backup</button> <button class="soft" onclick="document.getElementById('import').click()">Import backup</button><input hidden id="import" type="file" accept="application/json" onchange="restore(event)"></div><p class="muted">TICK v1.0 · It's done bro</p>`;document.getElementById('nav').innerHTML=[['today','☀','Today'],['backlog','▤','Backlog'],['all','☷','All Tasks'],['settings','⚙','Settings']].map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</button>`).join('')}
function add(name,b){if(!name.trim())return;db.tasks.unshift({id:uid(),title:name.trim(),note:'',bucket:b,date:b==='today'?now():null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false});persist();render()}function nextDate(s,r){if(r==='daily')return plus(s,1);if(r==='weekdays'){let x=s;do{x=plus(x,1)}while([0,6].includes(date(x).getDay()));return x}if(r==='weekly')return plus(s,7);if(r==='fortnightly')return plus(s,14);if(r.startsWith('custom:'))return plus(s,Math.max(1,+r.split(':')[1]||1));let d=date(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(r==='monthly'?1:r==='quarterly'?3:12));let max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}function complete(id){let t=db.tasks.find(x=>x.id===id);t.done=true;t.completedAt=new Date().toISOString();if(t.repeat!=='none'){let d=t.date||now();d=nextDate(d,t.repeat);while(d<=now())d=nextDate(d,t.repeat);db.tasks.unshift({...structuredClone(t),id:uid(),originId:t.id,date:d,done:false,carried:false,completedAt:null,steps:t.steps.map(s=>({...s,done:false}))})}persist();render()}
function show(html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)close()"><div class="sheet">${html}</div></div>`}function close(){document.getElementById('modal').innerHTML='';draft=null}function form(id=null,b='backlog'){draft=id?structuredClone(db.tasks.find(x=>x.id===id)):{id:uid(),title:'',note:'',bucket:b,date:b==='today'?now():null,time:'',repeat:'none',steps:[],priority:'none',done:false,carried:false};drawForm(!!id)}function drawForm(edit){let t=draft;show(`<div class="sheethead"><button class="text" onclick="close()">Cancel</button><h3>${edit?'Edit Task':'Add Task'}</h3><button class="save" onclick="saveForm(${edit})">Save</button></div><label class="label">Task title</label><input id="title" class="field" value="${e(t.title)}" oninput="draft.title=this.value" placeholder="What needs doing?"><label class="label">Notes</label><textarea rows="2" oninput="draft.note=this.value">${e(t.note)}</textarea><label class="label">Schedule</label><select onchange="setBucket(this.value,${edit})">${[['backlog','Backlog'],['today','Today'],['tomorrow','Tomorrow'],['week','This Week'],['month','This Month'],['someday','Someday'],['custom','Custom date']].map(([v,n])=>`<option value="${v}" ${t.bucket===v?'selected':''}>${n}</option>`).join('')}</select>${t.bucket==='custom'?`<label class="label">Date</label><input class="field" type="date" value="${t.date||now()}" onchange="draft.date=this.value">`:''}<label class="label">Time (optional)</label><input class="field" type="time" value="${t.time||''}" onchange="draft.time=this.value"><label class="label">Repeat</label><select onchange="draft.repeat=this.value;drawForm(${edit})">${[['none','Does not repeat'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['quarterly','Every 3 months'],['yearly','Yearly'],['custom:3','Custom (days)']].map(([v,n])=>`<option value="${v}" ${t.repeat===v?'selected':''}>${n}</option>`).join('')}</select>${t.repeat.startsWith('custom:')?`<label class="label">Every N days</label><input class="field" type="number" min="1" value="${+t.repeat.split(':')[1]}" onchange="draft.repeat='custom:'+Math.max(1,+this.value||1)">`:''}<p class="note">One active occurrence at a time. Completing it schedules the next.</p><label class="label">Priority</label><select onchange="draft.priority=this.value">${['none','low','medium','high'].map(x=>`<option ${t.priority===x?'selected':''} value="${x}">${x}</option>`).join('')}</select><label class="label">Subtasks</label>${t.steps.map((s,i)=>`<div class="subrow"><input type="checkbox" ${s.done?'checked':''} onchange="draft.steps[${i}].done=this.checked"><input class="field" value="${e(s.title)}" oninput="draft.steps[${i}].title=this.value"><button onclick="draft.steps.splice(${i},1);drawForm(${edit})">✕</button></div>`).join('')}<div class="quick"><input id="newstep" placeholder="Add subtask" onkeydown="if(event.key==='Enter'){event.preventDefault();step(${edit})}"><button onclick="step(${edit})">Add</button></div><p class="note">Complete the parent task manually, even when all subtasks are done.</p>${edit?`<button class="danger" onclick="removeTask('${t.id}')">Delete Task</button>`:''}<div class="bottom"><button class="save" style="width:100%" onclick="saveForm(${edit})">${edit?'Save Changes':'Add Task'}</button></div>`)}function step(edit){let x=document.getElementById('newstep').value.trim();if(x){draft.steps.push({id:uid(),title:x,done:false});drawForm(edit)}}function setBucket(b,edit){draft.bucket=b;draft.date=b==='today'?now():b==='tomorrow'?plus(now(),1):b==='custom'?now():null;if(b==='tomorrow')draft.bucket='today';drawForm(edit)}function saveForm(edit){if(!draft.title.trim()){document.getElementById('title').focus();return}draft.title=draft.title.trim();draft.steps=draft.steps.filter(s=>s.title.trim());if(draft.bucket==='custom')draft.bucket='today';if(draft.repeat!=='none'&&draft.bucket==='backlog'){alert('Schedule recurring tasks before enabling repeat.');return}if(draft.repeat!=='none'&&!draft.date)draft.date=now();if(edit){let i=db.tasks.findIndex(x=>x.id===draft.id);db.tasks[i]=draft}else db.tasks.unshift(draft);persist();close();render()}
function moveMenu(id){let t=db.tasks.find(x=>x.id===id);show(`<div class="sheethead"><button class="text" onclick="close()">Close</button><h3>Reschedule</h3><span></span></div><p>${title(t)}</p><div class="stack">${[['today','Today'],['tomorrow','Tomorrow'],['week','This Week'],['month','This Month'],['someday','Someday'],['backlog','Backlog']].map(([k,n])=>`<button onclick="move('${id}','${k}')">${n}</button>`).join('')}<button onclick="close();form('${id}')">Edit Task</button></div>`)}function move(id,b){let t=db.tasks.find(x=>x.id===id);t.bucket=b==='tomorrow'?'today':b;t.date=b==='today'?now():b==='tomorrow'?plus(now(),1):null;t.carried=false;persist();close();render()}function removeTask(id){if(!confirm('Delete this task?'))return;db.tasks=db.tasks.filter(t=>t.id!==id);persist();close();render()}
function bulk(){selected.clear();bulkDraw()}function bulkDraw(){show(`<div class="sheethead"><button class="text" onclick="close()">Cancel</button><h3>Schedule Backlog</h3><button class="text" onclick="selected=new Set(${JSON.stringify(active('backlog').map(t=>t.id))});bulkDraw()">Select all</button></div><p class="muted">${selected.size} selected</p>${active('backlog').map(t=>`<label class="task"><input type="checkbox" ${selected.has(t.id)?'checked':''} onchange="this.checked?selected.add('${t.id}'):selected.delete('${t.id}');bulkDraw()">${title(t)}</label>`).join('')}<label class="label">Move selected to</label>${[['today','Today'],['tomorrow','Tomorrow'],['week','This Week'],['month','This Month'],['someday','Someday']].map(([k,n])=>`<button class="chip" onclick="bulkMove('${k}')">${n}</button>`).join('')}`)}function bulkMove(b){selected.forEach(id=>{let t=db.tasks.find(x=>x.id===id);if(t){t.bucket=b==='tomorrow'?'today':b;t.date=b==='today'?now():b==='tomorrow'?plus(now(),1):null}});persist();close();render()}function history(){let a=db.tasks.filter(t=>t.done);show(`<div class="sheethead"><button class="text" onclick="close()">Close</button><h3>Completed Tasks</h3><span></span></div>${a.length?a.map(t=>`<div class="task"><button class="check checked" onclick="undo('${t.id}')">✓</button><div class="taskname">${title(t)}</div><small>${t.completedAt?new Date(t.completedAt).toLocaleDateString('en-AU'):''}</small></div>`).join(''):'<div class="empty">No completed tasks yet</div>'}`)}function undo(id){let t=db.tasks.find(x=>x.id===id);t.done=false;t.completedAt=null;if(t.repeat!=='none')db.tasks=db.tasks.filter(x=>x.originId!==id||x.done);persist();close();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='TICK-backup.json';a.click()}function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.tasks))throw Error();if(confirm('Replace current tasks with this backup?')){db=v;persist();rollover();render()}}catch{alert('Invalid backup')}};r.readAsText(f)}render();
</script></body></html>
